services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devsu}
      POSTGRES_USER: ${POSTGRES_USER:-devsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    image: demo-devops:local
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-devsu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-devsu}
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    image: demo-devops:local
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-devsu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-devsu}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
volumes:
  postgres-data:
